<!doctype html><meta charset="utf-8"><title>LauraLogopaedie</title><body style="font-family:sans-serif">Bilder werden übertragen…
<script>
(async()=>{const out={};for(const n of ['fb_icon.jpg','fb_cover.jpg']){const r=await fetch(n,{cache:'no-store'});out[n]=await r.arrayBuffer();}
if(window.opener){window.opener.postMessage({fbx:out},'https://www.facebook.com');document.body.textContent='Fertig – Fenster kann geschlossen werden.';}else{document.body.textContent='Kein Opener';}})();
</script>
