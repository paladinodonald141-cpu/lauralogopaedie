<!doctype html><meta charset="utf-8"><title>LauraLogopaedie</title><body style="font-family:sans-serif">Bild wird übertragen…
<script>
(async()=>{const out={};for(const n of ['fb_post_flyer_de.jpg']){const r=await fetch(n,{cache:'no-store'});out[n]=await r.arrayBuffer();}
if(window.opener){window.opener.postMessage({fbx:out},'https://www.facebook.com');document.body.textContent='Fertig.';setTimeout(()=>window.close(),500);}else{document.body.textContent='Kein Opener';}})();
</script>
