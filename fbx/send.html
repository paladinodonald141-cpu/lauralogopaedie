<!doctype html><meta charset="utf-8"><title>LauraLogopaedie</title><body style="font-family:sans-serif">Dateien werden übertragen…
<script>
(async()=>{const man=await (await fetch('manifest.json',{cache:'no-store'})).json();const out={};
for(const k in man){for(const n of man[k]){const r=await fetch(n,{cache:'no-store'});out[n]=await r.arrayBuffer();}}
if(window.opener){window.opener.postMessage({fbx:out,man},'https://www.facebook.com');document.body.textContent='Fertig.';setTimeout(()=>window.close(),800);}else{document.body.textContent='Kein Opener';}})();
</script>
